<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Belize Flood Story</title>
<meta name="description" content="A 3D scrollytelling map of flood hazard, population exposure and early-warning coverage in Belize." />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css"
      integrity="sha512-qN/uDg9bS3IAldWq4lswyC+9ZSoShtfyNDp+FaJhdtXJqdgubHA+s4nB8BajW0m90Y0+RBGbqu2anzbxiQYdHA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="map"></div>

<div class="tools">
  <div id="basemaps" class="segmented">
    <button data-base="dark" class="on" title="Dark">Dark</button>
    <button data-base="light" title="Light">Light</button>
    <button data-base="satellite" title="Satellite">Satellite</button>
  </div>
  <button id="replay" class="iconbtn" title="Replay this scene">⟳</button>
</div>

<nav id="progress"></nav>
<div id="tooltip"></div>

<!-- scroll-driven narrative; sections are built by app.js -->
<main id="scrolly"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"
        integrity="sha512-dXgoFR02YHJ9Fa29P3D/1umNaZ0EXS2N0w29Lm3b/1BK8UDLMdLWDFwuujIyJJdU27/PLuk3dmS1V9NO8ABX1A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.0.36/dist.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
